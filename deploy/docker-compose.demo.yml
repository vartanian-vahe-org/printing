# Demo deployment on a single server (Phase 1 step 7.5).
# Postgres, Redis and object storage run in containers here to keep the demo cheap and simple;
# production moves them to RDS / ElastiCache / S3 (docs/open-issues.md I3).
#
#   docker compose -f deploy/docker-compose.demo.yml --env-file deploy/.env.demo up -d --build
#
# Only Caddy is reachable from the internet (80/443). The site is behind a password (basic auth).
#
# Two layouts, chosen in deploy/.env.demo (deploy/make-env.sh writes it):
#   all-in-one  storefront + admin here too (COMPOSE_PROFILES=sites, CADDYFILE=Caddyfile)
#   split       storefront and admin on Vercel, this server runs the backend only
#               (no profile, CADDYFILE=Caddyfile.backend); see deploy/VERCEL.md
name: printing-demo

x-restart: &restart
  restart: unless-stopped

services:
  caddy:
    <<: *restart
    image: caddy:2.11.7-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH}
    volumes:
      - ./${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_started
      storage:
        condition: service_started
      mailpit:
        condition: service_started
      # Only in the all-in-one layout (profile "sites").
      web:
        condition: service_started
        required: false
      admin:
        condition: service_started
        required: false

  postgres:
    <<: *restart
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    <<: *restart
    image: redis:8.8.3-trixie
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  storage:
    <<: *restart
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - storage_data:/data

  storage-init:
    image: amazon/aws-cli:2.38.1
    depends_on:
      - storage
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION}
      BUCKET: ${S3_BUCKET}
      # The browser uploads straight to storage (presigned URLs) from the storefront and admin.
      CORS_ORIGINS: ${SITE_URLS:-https://${DOMAIN},https://admin.${DOMAIN}}
    volumes:
      - ../docker/storage-init.sh:/storage-init.sh:ro
    entrypoint: ["sh", "/storage-init.sh"]
    restart: "no"

  migrate:
    # Same image as the API: it ships @printing/db with its migrations and scripts.
    image: printing-api:demo
    pull_policy: never
    command:
      - sh
      - -c
      - node node_modules/@printing/db/dist/scripts/migrate.js && node node_modules/@printing/db/dist/scripts/seed-admin.js
    depends_on:
      api-image:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME}
    restart: "no"

  # Builds the API image once so `migrate` and `api` share it.
  api-image:
    image: printing-api:demo
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: ["node", "-e", "process.exit(0)"]
    restart: "no"

  api:
    <<: *restart
    image: printing-api:demo
    pull_policy: never
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    environment:
      PORT: 4000
      # Sites allowed to call the API from the browser (split layout: the Vercel domains).
      CORS_ORIGINS: ${SITE_URLS:-https://${DOMAIN},https://admin.${DOMAIN}}
      # Cookies (cart, customer and admin sessions) only over HTTPS.
      COOKIE_SECURE: "true"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://storage:9000
      # Presigned upload/download links point at the public storage host (Caddy, files.<domain>).
      S3_PUBLIC_ENDPOINT: https://files.${DOMAIN}
      S3_FORCE_PATH_STYLE: "true"
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      # Links in emails (order page, admin password reset).
      WEB_URL: ${WEB_URL:-https://${DOMAIN}}
      ADMIN_URL: ${ADMIN_URL:-https://admin.${DOMAIN}}
      ORDER_LINK_SECRET: ${ORDER_LINK_SECRET}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
      # Shared with the Vercel /api proxies (split layout); empty in all-in-one.
      API_PROXY_SECRET: ${API_PROXY_SECRET:-}
      # The demo sends no real email: Mailpit catches it (open issue S15).
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM_ADDRESS: orders@printing.local

  # File checks and proof images (Phase 2 step 8).
  worker-prepress:
    <<: *restart
    image: printing-worker-prepress:demo
    build:
      context: ../apps/worker-prepress
      target: prod
    depends_on:
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    environment:
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://storage:9000
      S3_FORCE_PATH_STYLE: "true"
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}

  # Catches the demo's outgoing email; read it at https://mail.<DOMAIN> (same password as the site).
  mailpit:
    <<: *restart
    image: axllent/mailpit:v1.31.6

  web:
    <<: *restart
    profiles: ["sites"]
    image: printing-web:demo
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.${DOMAIN}
    depends_on:
      - api
    environment:
      API_INTERNAL_URL: http://api:4000

  admin:
    <<: *restart
    profiles: ["sites"]
    image: printing-admin:demo
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_API_URL: https://api.${DOMAIN}
        VITE_STOREFRONT_URL: https://${DOMAIN}/business-cards

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  storage_data:
