# Demo deployment on a single server (Phase 1 step 7.5).
# Postgres, Redis and object storage run in containers here to keep the demo cheap and simple;
# production moves them to RDS / ElastiCache / S3 (docs/open-issues.md I3).
#
#   docker compose -f deploy/docker-compose.demo.yml --env-file deploy/.env.demo up -d --build
#
# Only Caddy is reachable from the internet (80/443). The site is behind a password (basic auth).
name: printing-demo

x-restart: &restart
  restart: unless-stopped

services:
  caddy:
    <<: *restart
    image: caddy:2.11.7-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  postgres:
    <<: *restart
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    <<: *restart
    image: redis:8.8.3-trixie
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  storage:
    <<: *restart
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - storage_data:/data

  storage-init:
    image: amazon/aws-cli:2.38.1
    depends_on:
      - storage
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION}
      BUCKET: ${S3_BUCKET}
    volumes:
      - ../docker/storage-init.sh:/storage-init.sh:ro
    entrypoint: ["sh", "/storage-init.sh"]
    restart: "no"

  migrate:
    # Same image as the API: it ships @printing/db with its migrations and scripts.
    image: printing-api:demo
    pull_policy: never
    command:
      - sh
      - -c
      - node node_modules/@printing/db/dist/scripts/migrate.js && node node_modules/@printing/db/dist/scripts/seed-admin.js
    depends_on:
      api-image:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME}
    restart: "no"

  # Builds the API image once so `migrate` and `api` share it.
  api-image:
    image: printing-api:demo
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: ["node", "-e", "process.exit(0)"]
    restart: "no"

  api:
    <<: *restart
    image: printing-api:demo
    pull_policy: never
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    environment:
      PORT: 4000
      CORS_ORIGINS: https://${DOMAIN}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://storage:9000
      S3_FORCE_PATH_STYLE: "true"
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}

  web:
    <<: *restart
    image: printing-web:demo
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    environment:
      API_INTERNAL_URL: http://api:4000

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  storage_data:
